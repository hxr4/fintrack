name: fintrack
description: "Personal budget planner and expense tracker."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.7

dependencies:
  budget_engine:
    path: packages/budget_engine
  cryptography: ^2.9.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  home_widget: ^0.10.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  share_plus: ^13.3.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  sqlite3: ^3.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/gear/
